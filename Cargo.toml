[package]
authors.workspace = true
description = "Universal CJK Layouting Implementation in Rust"
edition.workspace = true
license.workspace = true
name = "tiqian"
repository.workspace = true
version = "0.7.0"

include = [
    "/src/**/*",
    "/resources/hyphenation/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[features]
default = ["std"]

std = ["runtime-std", "collections-hashbrown", "math-std", "shared-auto"]
no-std = ["collections-hashbrown", "math-libm", "shared-auto"]
runtime-std = []
collections-hashbrown = ["dep:hashbrown"]
collections-std = ["runtime-std"]
math-std = ["runtime-std"]
math-libm = ["dep:libm"]
shared-auto = []
shared-portable = ["dep:portable-atomic-util"]
debug-info = []

[dependencies]
icu_properties = {version = "2.4", default-features = false, features = ["compiled_data"]}
log = {version = "0.4", default-features = false}
once_cell = {version = "1.21", default-features = false, features = ["alloc"]}
libm = {version = "0.2", optional = true}

hashbrown = {version = "0.17", optional = true}

[target.'cfg(target_has_atomic = "ptr")'.dependencies]
portable-atomic-util = {version = "0.2", default-features = false, features = ["alloc"], optional = true}

[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic-util = {version = "0.2", default-features = false, features = ["alloc"]}
once_cell = {version = "1.21", default-features = false, features = ["alloc", "portable-atomic"]}

[workspace]
default-members = [".", "crates/tiqian-tests", "crates/tiqian-demo", "crates/tiqian-bench"]
members = ["crates/tiqian-tests", "crates/tiqian-demo", "crates/tiqian-bench"]
resolver = "3"

[workspace.package]
authors = ["123Duo3 <123duo3@gmail.com>", "Icemic <bingfeng.web@gmail.com>"]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/tiqian-cjk/tiqian-rs"

[package]
description = "Universal CJK Layouting Implementation in Rust"
edition = "2024"
exclude = ["examples"]
license = "MPL-2.0"
name = "tiqian"
repository = "https://github.com/Icemic/tiqian-rs"
version = "0.1.0"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
unicode-general-category = "1.1.0"

[dev-dependencies]
harfrust = "0.13"
read-fonts = "0.43"
skrifa = "0.46"
softbuffer = "0.4.6"
tiny-skia = "0.11.4"
winit = "0.30"

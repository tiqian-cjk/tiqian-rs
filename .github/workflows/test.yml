name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Test (std)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Build
        run: cargo build --all-targets
      - name: Run tests
        run: cargo test --all-targets

  no-std-build:
    name: Build and Test (no-std)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Test core without std
        run: cargo test -p tiqian --lib --no-default-features --features no-std
      - name: Test integration and golden without std
        run: cargo test -p tiqian-tests --no-default-features --features no-std

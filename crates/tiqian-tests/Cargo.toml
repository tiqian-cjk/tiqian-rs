[package]
name = "tiqian-tests"
description = "tiqian 的集成测试与 golden 语料"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.0.0"
publish = false

[features]
default = ["std"]
std = ["tiqian/std"]
no-std = ["tiqian/no-std"]
collections-hashbrown = ["tiqian/collections-hashbrown"]
collections-std = ["tiqian/collections-std"]
math-std = ["tiqian/math-std"]
math-libm = ["tiqian/math-libm"]
shared-auto = ["tiqian/shared-auto"]
shared-portable = ["tiqian/shared-portable"]

[dependencies]
tiqian = { path = "../..", default-features = false, features = ["debug-info"] }

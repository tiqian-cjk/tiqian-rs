[package]
name = "tiqian-demo"
description = "tiqian 的桌面演示程序"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version = "0.0.0"
publish = false

[features]
default = ["std"]
std = ["tiqian/std"]
no-std = ["tiqian/no-std"]
debug-info = ["tiqian/debug-info"]

[dependencies]
tiqian = { path = "../..", default-features = false }
harfrust = "0.13"
pollster = "1.0"
skrifa = "0.46"
vello = "0.10.0"
winit = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
mimalloc = "0.1.47"
